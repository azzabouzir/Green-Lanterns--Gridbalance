services:
  api:
    build: .
    ports: ["3000:3000"]
    environment: {SPEED: "1", SECRET: "change-me", SCADA_KEY: "change-me-too"}
    volumes: ["./data:/app/data"]
  scada-sim:
    build: .
    command: ["node","scada-sim.js"]
    environment: {API: "http://api:3000", SCADA_KEY: "change-me-too"}
    depends_on: [api]
