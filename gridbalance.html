function alloc(p,w,need,cp){let a={},act=p.slice(),tot=()=>Object.values(a).reduce((s,v)=>s+v,0);for(let it=0;it<8&&need-tot()>.5&&act.length;it++){let left=need-tot(),tw=act.reduce((s,c)=>s+w(c),0)||1,nx=[];act.forEach(c=>{let room=cp(c)-(a[c.id]||0),g=Math.min(left*w(c)/tw,room);a[c.id]=(a[c.id]||0)+g;if(room-g>.5)nx.push(c)});act=nx}return{a,left:Math.max(0,need-tot())}}

let b=S.sc.map(s=>{let m=met(s);return m.cons/1e5+m.fb/40+s.left/50});S.rec=stale()?-1:b.indexOf(Math.min(...b));S.ap=-1;log(`AI generated ${S.sc.length} scenarios for ${need} MW`,2)}

V.usr=()=>{let G=[...new Set(S.b.map(b=>b.gov))],cs=AC(),all=cs.reduce((t,c)=>t+tot(cnt(c)),0),al=alStat(),gr=G.map(g=>{let l=cs.filter(c=>c.gov==g),b=S.b.find(x=>x.gov==g);return{g,b,l,n:l.reduce((t,c)=>t+tot(cnt(c)),0),s:l.reduce((t,c)=>t+alC(c).s,0),q:l.reduce((t,c)=>t+alC(c).q,0)}}),sel=gr.find(x=>x.g==S.ug);
return `<div class="gr">${kp('Governorates',G.length)}${kp('Cities',cs.length)}${kp('Registered citizens',nf(all))}${kp('Alerts sent',nf(al.s),'','g')}${kp('Alerts queued',nf(al.q),'','o')}</div>
<div class="card"><b>Governorates</b> <small>(open one to manage its cities and citizens — alerts go to citizens only)</small>${tb(['Governorate','BCC','CRC','Cities','Citizens','Alerts sent','Alerts queued',''],gr.map(x=>[x.g,x.b.n,x.b.crc,x.l.length,nf(x.n),nf(x.s),nf(x.q),bt(x.g==S.ug?'Selected':'Open',`S.ug='${x.g}';S.up=0;S.uq='';S.ue='';render()`,x.g==S.ug?'pr':'')]))}</div>${sel?gdet(sel):'<div class="card"><small>Select a governorate to see and manage its cities.</small></div>'}
<div class="card"><b>Operators</b>${tb(['Role','Scope','Data'],[['National Dispatching','All Tunisia','—'],...['North','South'].map(r=>['CRC '+r,S.b.filter(b=>b.crc==r).map(b=>b.n).join(', '),'—']),...S.b.map(b=>['BCC '+b.n,b.gov+' — '+AC().filter(c=>c.bcc==b.n).length+' cities',dot(dq(b)[0])+dq(b)[1]])])}</div><div class="card"><b>Industrial consumers</b>${tb(['Factory','Consumption','Flexible','Status'],S.fx.map(x=>[x.n,x.cur+' MW',x.mw+' MW',bg(FS[x.st],x.st+(x.cm?' ✔':''))]))}</div>`};
function admAdd(g){let n=($('#an').value||'').trim();if(!n){S.ue='Enter a city name.';return render()}if(AC().some(c=>c.gov==g&&c.name.toLowerCase()==n.toLowerCase())){S.ue='This city already exists in '+g+'.';return render()}let b=S.b.find(x=>x.gov==g);S.cities.push({id:S.cities.length,name:n,gov:g,bcc:b.n,pop:+$('#ap').value||20000,dem:+$('#ad').value||40,pr:3,x:b.x+(Math.random()-.5)*24,y:b.y+12+Math.random()*10,prot:false,h:[]});S.ue='';log(`City ${n} added to ${g} by the administrator`,0);render()}
function admDel(i){let c=S.cities[i];if(S.sl.some(x=>x.c==i&&!['Restored','Cancelled'].includes(x.st))){S.ue=c.name+' has a planned or running outage: it cannot be removed now.';return render()}if(S.acc.some(a=>a.c==i)){S.ue=c.name+' has registered citizen accounts: it cannot be removed.';return render()}c.off=1;S.ue='';log(`City ${c.name} removed by the administrator`,0);render()}
const cnt=c=>{let a=(S.reg[c.id]||[0,0,0]).slice();S.acc.forEach(x=>{if(x.c==c.id)a[x.nt=='App'?0:x.nt=='SMS'?1:2]++});return a},tot=a=>a[0]+a[1]+a[2];
const alStat=()=>{let q=0,s=0;S.sl.forEach(x=>{if(x.st=='Proposed'||x.st=='Cancelled')return;let n=tot(cnt(S.cities[x.c]));if(x.st=='Scheduled'||x.st=='Delayed')q+=n;else s+=n});return{q,s}};
function genCit(n){let cs=AC(),tw=cs.reduce((t,c)=>t+c.pop,0);for(let i=0;i<n;i++){let r=Math.random()*tw,c=cs[cs.length-1];for(let k=0;k<cs.length;k++){r-=cs[k].pop;if(r<=0){c=cs[k];break}}let a=S.reg[c.id]=S.reg[c.id]||[0,0,0];a[Math.random()<.35?0:Math.random()<.5?1:2]++}log(`${nf(n)} citizens registered (generated)`,0)}
function seed(){S.fz=1;S.q={need:300,dur:45,area:'All'};S.now=1130;gen();S.pipe=99;ap(2);S.now=1135;
['North','South'].forEach(r=>{S.u={t:'CRC',crc:r};fw()});S.now=1137;
S.b.forEach(b=>{if(!S.bo[b.n]||b.n=='Gafsa')return;S.u={t:'BCC',bcc:b.n};cf();adv();if(b.n=='Sousse')return;adv()});
let fs=b=>{let x=S.sl.find(y=>y.b==b);return x&&x.c};[['Sousse',0],['Sfax',1]].forEach(p=>{let c=fs(p[0]);if(c!=null){S.acc[p[1]].c=c;S.acc[p[1]].g=p[0]}});
Object.assign(S.fx[0],{st:'Available',cm:1,note:'You accepted the request: you are now available.'});Object.assign(S.fx[2],{st:'Offered',cm:0,pm:{mw:2.5,dur:40,msg:'Available 19:00–19:40'},note:'Proposal sent — waiting for National Dispatching.'});
S.rp.push({t:1141,crc:'South',type:'Constraint',msg:'BCC Gafsa is waiting for confirmation'});log('CRC South reported to DN: Constraint — BCC Gafsa is waiting for confirmation',0,'South');
genCit(12000);S.fz=0;S.u=null;S.hs=[];S.view='ov';S.now=1146}
seed();render();
