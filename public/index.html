<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIDBALANCE Platform</title>
<style>:root{--bg:#eef2f0;--c:#fff;--t:#10222d;--m:#526672;--l:#c9d5d1;--a:#e3a008;--g:#2e9e5b;--r:#d8452f;--o:#e8782a}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a22;--c:#132833;--t:#eaf1ee;--m:#93a8b1;--l:#26414e}}
#lg{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:4px;z-index:9;background:var(--c);border:1px solid var(--l);border-radius:8px;padding:3px}#lg button{padding:3px 9px}#lg button.on{background:var(--a);border-color:var(--a);color:#10222d;font-weight:700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,sans-serif;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px;margin:10px auto;max-width:1100px}.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.k{border-left:4px solid var(--a);padding:4px 10px}.k small{color:var(--m);display:block}.k b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--l)}th{color:var(--m)}.sc{overflow-x:auto}
button,input,select{font:inherit;padding:6px 10px;border:1px solid var(--l);border-radius:7px;background:var(--c);color:var(--t)}button{cursor:pointer}button.p{background:var(--a);border-color:var(--a);color:#10222d;font-weight:600}
.b{padding:1px 8px;border-radius:99px;color:#fff;font-size:12px}.bar{height:6px;background:var(--l);border-radius:3px;min-width:60px}.bar i{display:block;height:100%;border-radius:3px}
.w{background:#fff3cd;color:#10222d;border-left:4px solid var(--a);padding:6px 10px;margin:8px 0}h1,h3{margin:0 0 6px}input[type=number]{width:90px}</style>
<div id="lg"><button data-l="en" onclick="setLg('en')">EN</button><button data-l="fr" onclick="setLg('fr')">FR</button></div><div id="app"></div><script>
let SC=null,SCK='',H=null,HC=0,T=sessionStorage.t,ME=JSON.parse(sessionStorage.me||'null'),ST=null,WS;const $=s=>document.querySelector(s),r1=v=>Math.round(v*10)/10,tm=t=>new Date(t).toLocaleTimeString(LG=='fr'?'fr-FR':'en-GB');
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok){if(r.status==401&&p!='login')out();alert(i18n(j.error||r.status));throw 0}return j};
const USERS=['dn','crc_north','crc_south','bcc_tunis','bcc_grombalia','bcc_sousse','bcc_beja','bcc_sfax','bcc_gabes','bcc_gafsa','admin','ind_a','ind_b','ind_c','cit_sami','cit_amel'];
function out(){sessionStorage.clear();T=ME=null;WS&&WS.close();draw()}
async function login(){const j=await api('login',{user:$('#u').value,pass:$('#pw').value});T=j.token;ME=j;sessionStorage.t=T;sessionStorage.me=JSON.stringify(j);connect();refresh()}
function connect(){WS=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);WS.onmessage=()=>refresh();WS.onclose=()=>T&&setTimeout(connect,2000)}
async function refresh(){if(!T)return;if(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName)&&ST)return;try{ST=await api(ME.role=='CIT'?'citizen':ME.role=='IND'?'industrial':'state')}catch(e){return}if(!['CIT','IND'].includes(ME.role)&&(!H||HC++%5==0))try{H=await api('history')}catch(e){}if(ME.role=='DN'&&ST.sit){const k=ST.sit.deficit+'|'+ST.sit.flexAccepted+'|'+(ST.order?ST.order.id+ST.order.status:'');if(k!=SCK){SCK=k;try{SC=await api('scenarios',{})}catch(e){}}}draw()}
const bd=(c,t)=>`<span class="b" style="background:var(--${c})">${t}</span>`,kp=(l,v,c)=>`<div class="k"><small>${l}</small><b${c?` style="color:var(--${c})"`:''}>${v}</b></div>`;
const act=async(p,b)=>{try{await api(p,b);refresh()}catch(e){}},shares=()=>{const s={};document.querySelectorAll('[data-b]').forEach(i=>s[i.dataset.b]=+i.value);return s};
function draw(){const A=$('#app');if(!ME){A.innerHTML=`<div class="card" style="max-width:420px"><h1>GRIDBALANCE</h1><p>Platform v2 · REST + WebSocket</p><p><select id="u">${USERS.map(u=>`<option>${u}</option>`)}</select> <input id="pw" type="password" placeholder="password" value="demo"> <button class="p" onclick="login()">Sign in</button></p><small>Demo accounts, password "demo". <a href="prototype.html">Open offline prototype</a></small></div>`;return}
if(!ST){A.innerHTML='<div class="card">Loading…</div>';return}if(ME.role=='CIT'){A.innerHTML=citHtml(ST);return}if(ME.role=='IND'){A.innerHTML=indHtml(ST);return}const s=ST,k=s.kpi,o=s.order,R=ME.role,L=s.limit;
A.innerHTML=`<div class="card"><b>GRIDBALANCE</b> · ${R}${ME.scope?' · '+ME.scope:''} <button onclick="out()" style="float:right">Log out</button> <small>${s.speed} sim-min per real second · limit ${L} min/feeder</small></div>
${!s.link?'<div class="card w"><b>SCADA link cut (simulated).</b> Telemetry will turn STALE; commands on stale feeders are refused.</div>':''}${k.stale?`<div class="card w">⚠ ${k.stale} feeder(s) with stale telemetry. No confident decision is possible on them.</div>`:''}
<div class="card"><div class="gr">${kp('Target',k.target+' MW')}${kp('Actual',k.actual+' MW','g')}${kp('Deviation',k.deviation+' MW',Math.abs(k.deviation)>k.target*.1?'r':'g')}${kp('Execution',k.execution+' %')}${kp('Open feeders',k.open)}${kp('Max duration',k.maxDuration+' min')}${kp('Rotations',k.rotations)}${kp('Alarms',k.alarms,'r')}${kp('ENS',k.ens+' MWh')}${kp('Response',k.responseMin==null?'—':k.responseMin+' min')}</div></div>
<div class="card"><h3>Order ${o?'#'+o.id+' · '+o.mw+' MW · '+o.mode+' · '+bd('o',o.status):'— none'}</h3>
${R=='DN'?`<p>${!o||['Done'].includes(o.status)?`<select id="pre" onchange="if(this.value)$('#mw').value=this.value"><option value="">Generation outage preset…</option><option value="120">TG, 120 MW</option><option value="180">½ CC, 180 MW</option><option value="200">TVcc IPP, 200 MW</option><option value="280">CO. CC, 280 MW</option><option value="420">CCGHN or CCSSEC, 420 MW</option><option value="500">CCGHN + TG, 500 MW</option></select> <input id="mw" type="number" value="120"> MW <select id="md"><option>RT</option><option>J1</option></select> <button class="p" onclick="act('orders',{mw:+$('#mw').value,mode:$('#md').value,cause:$('#pre').value?$('#pre').selectedOptions[0].text:''})">Create order (official distribution keys)</button>`:`<button onclick="act('close',{})">Order restoration</button>`}</p>`:''}
${s.alloc.length?`<div class="sc"><table><tr><th>Level</th><th>Name</th><th>Target MW</th></tr>${s.alloc.map(a=>`<tr><td>${a.level}</td><td>${a.name}</td><td>${R=='CRC'&&a.level=='BCC'?`<input type="number" step="0.1" data-b="${a.name}" value="${a.mw}">`:a.mw}</td></tr>`).join('')}</table></div>`:''}
${R=='CRC'&&o?`<p><button class="p" onclick="act('alloc',{shares:shares()})">Apply allocation (checks Σ BCC = CRC)</button></p>`:''}
${R=='BCC'&&o&&o.status!='Done'?`<p><button class="p" onclick="act('execute',{})">Execute: send OPEN commands to RTU</button></p>`:''}
${R=='ADMIN'?`<p><button onclick="act('link',{up:${!s.link}})">${s.link?'Cut SCADA link (simulate comms loss)':'Restore SCADA link'}</button></p>`:''}</div>
<div class="card"><h3>MT feeders</h3><div class="sc"><table><tr><th>Feeder</th><th>BCC</th><th>State</th><th>MW</th><th>Timer</th><th>Left</th><th>Cum.</th><th>Rot.</th><th>Alarm</th><th></th></tr>
${s.feeders.map(f=>`<tr><td>${f.id}${f.crit?' ★':''}</td><td>${f.bcc}</td><td>${f.stale?bd('m','STALE'):f.state=='OPEN'?bd('r','OPEN'):bd('g','CLOSED')}${f.cmd?' → '+f.cmd:''}</td><td>${f.meas}</td><td><div class="bar"><i style="width:${Math.min(100,f.elapsed/L*100)}%;background:var(--${f.al==2?'r':f.al?'o':'g'})"></i></div>${f.state=='OPEN'?f.elapsed+' min':''}</td><td>${f.remaining==null?'':f.remaining+' min'}</td><td>${f.cum}</td><td>${f.rot}</td><td>${f.al==2?bd('r','ALARM'):f.al?bd('o','Warning'):''}</td><td>${R=='BCC'?(f.cand?`<button class="p" onclick="act('rotate',{id:'${f.id}'})">Rotate → ${f.cand}</button>`:'')+(f.state=='CLOSED'?`<button onclick="act('command',{id:'${f.id}',cmd:'OPEN'})">Open</button>`:`<button onclick="act('command',{id:'${f.id}',cmd:'CLOSE'})">Close</button>`):''}</td></tr>`).join('')}</table></div><small>★ critical feeder: never selected, manual cut blocked.</small></div>
${R=='DN'?decCard(s):''}${chainCard(s)}${histCard()}${siteCard(s)}${learnCard(s)}${fairCard(s)}${R=='DN'?flexCard(s):''}${R=='ADMIN'?`<div class="card"><h3>Citizen alerts</h3>${s.alerts.map(a=>a.status+': '+a.n).join(' · ')||'none yet'}</div>`:''}<div class="card"><h3>Audit trail</h3><div class="sc"><table><tr><th>Time</th><th>Who</th><th>Action</th><th>Detail</th></tr>${s.events.map(e=>`<tr><td>${tm(e.ts)}</td><td>${e.actor} (${e.role})</td><td>${e.action}</td><td>${e.detail}</td></tr>`).join('')}</table></div></div>`}
const LV={g:'Light',y:'Moderate',o:'High',r:'Heavy'},hd=(a,u)=>`<div class="card"><b>GRIDBALANCE</b> · ${a} <button onclick="out()" style="float:right">Log out</button></div>`;
const fairCard=s=>`<div class="card"><h3>Fairness Index · national ${s.fair.national}/100</h3><div class="sc"><table><tr><th>City</th><th>BCC</th><th>Score</th><th>Outages</th><th>Minutes</th><th>Priority</th></tr>${s.fair.cities.slice().sort((a,b)=>a.score-b.score).map(c=>`<tr><td>${c.name}</td><td>${c.bcc}</td><td>${bd(c.level,c.score+' '+LV[c.level])}</td><td>${c.n}</td><td>${c.min}</td><td>P${c.pr}</td></tr>`).join('')}</table></div><small>Higher score = lighter recent burden. Allocation and feeder selection favour high-score zones; every restored outage updates the history.</small></div>`;
const flexCard=s=>`<div class="card"><h3>Industrial flexibility (used before conventional shedding)</h3><div class="sc"><table><tr><th>Site</th><th>Reducible</th><th>For</th><th>State</th><th></th></tr>${s.flex.map(x=>`<tr><td>${x.name}</td><td>${x.mw} MW</td><td>${x.dur} min</td><td>${bd(['Accepted','In use'].includes(x.state)?'g':x.state=='Offered'?'o':x.state=='Declined'?'r':'m',x.state)}${x.state=='Offered'?` offer ${x.omw} MW / ${x.odur} min ${x.msg}`:''}</td><td>${['Available','Declined'].includes(x.state)?`<button onclick="act('flex/request',{id:'${x.id}'})">Request</button>`:x.state=='Offered'?`<button class="p" onclick="act('flex/decide',{id:'${x.id}',accept:true})">Accept</button> <button onclick="act('flex/decide',{id:'${x.id}',accept:false})">Decline</button>`:''}</td></tr>`).join('')}</table></div><small>Accepted MW is deducted from the order before it is split between regions.</small></div>`;
const citHtml=c=>hd('Citizen · '+c.city+' ('+c.bcc+')')+`<div class="card"><h3>My electricity</h3><p>${bd(c.supply=='Normal'?'g':c.supply=='Interrupted'?'r':'o',c.supply)} · alerts by ${c.channel}</p>${c.alerts.map(a=>`<div class="w"><b>⚠ Electricity interruption alert</b><br>Area: ${c.city} · feeder ${a.feeder} · ${a.status}${a.status=='Alert sent'?' · starts in '+a.in+' min':''}<br>Cause: ${a.cause} · estimated duration: ${a.est}</div>`).join('')||'<p>No alert for your area.</p>'}</div><div class="card"><h3>Why is my electricity cut?</h3><ol><li>National demand exceeded available supply.</li><li>An operator approved a shared reduction.</li><li>Critical sites (hospitals, water) were protected.</li><li>Your area's recent burden score is ${c.score}/100 (${LV[c.level]}), which is why it can be part of the rotation.</li></ol></div><div class="card"><h3>My history</h3>${c.outages} outages · ${c.minutes} min</div>`;
const indHtml=f=>hd('Industrial · '+f.name)+`<div class="card"><h3>My flexibility</h3><div class="gr">${kp('Consumption',f.cur+' MW')}${kp('Reducible',f.mw+' MW','g')}${kp('For',f.dur+' min')}${kp('Status',f.state)}</div>${f.state=='Requested'?`<div class="w">National Dispatching requests ${f.mw} MW for ${f.dur} min.</div><button class="p" onclick="act('flex/respond',{accept:true})">Accept</button> <button onclick="act('flex/respond',{accept:false})">Decline</button>`:''}<p>My own proposal: <input id="om" type="number" value="${f.mw}"> MW <input id="od" type="number" value="${f.dur}"> min <input id="oq" placeholder="conditions"> <button onclick="act('flex/respond',{offer:{mw:+$('#om').value,dur:+$('#od').value,msg:$('#oq').value}})">Send proposal</button></p></div>`;
const NORTH=['Tunis','Grombalia','Sousse','Beja'],stp=(a,k)=>a.find(x=>x.detail==k),tt=x=>x?`${x.by} · ${tm(x.ts)}`:'—',names=a=>a.map(x=>x.by).join(', ')||'—';
const refuse=()=>{const r=prompt(i18n('Reason for refusing (visible in the audit trail):'));if(r)act('accept',{ok:false,reason:r})};
const chainCard=s=>{const f=s.flow;if(!f)return'';const me=ME.role,crc=NORTH.includes(ME.scope)?'North':'South';
 return `<div class="card"><h3>Order chain: who set it, who accepted it, who executed it</h3><p>Set by <b>${tt(f.created)}</b>${f.restoration?` · restoration ordered by ${tt(f.restoration)}`:''}${f.completed?' · completed':''}</p><div class="sc"><table><tr><th>Level</th><th>Name</th><th>MW</th><th>Acknowledged / accepted by</th><th>Executed by</th></tr>${s.alloc.map(a=>`<tr><td>${a.level}</td><td>${a.name}</td><td>${a.mw}</td><td>${tt(stp(a.level=='CRC'?f.ack:f.accepted,a.name))}</td><td>${a.level=='BCC'?tt(f.executed.find(x=>x.by.endsWith(a.name.toLowerCase()))):''}</td></tr>`).join('')}</table></div>
 ${me=='CRC'&&!stp(f.ack,ME.scope)?`<p><button class="p" onclick="act('accept',{})">Acknowledge order</button> <button onclick="refuse()">Refuse…</button></p>`:''}${me=='BCC'&&stp(f.ack,crc)&&!stp(f.accepted,ME.scope)?`<p><button class="p" onclick="act('accept',{})">Accept order</button> <button onclick="refuse()">Refuse…</button></p>`:''}${me=='BCC'&&!stp(f.ack,crc)?'<small>Waiting for the CRC to acknowledge the order.</small>':''}</div>`};
const histCard=()=>!H?'':`<div class="card"><h3>Order history</h3><p>${bd(H.integrity.ok?'g':'r',H.integrity.ok?`Audit chain intact (${H.integrity.checked} signed records)`:`Audit chain BROKEN at record #${H.integrity.brokenAt}`)}</p><div class="sc"><table><tr><th>#</th><th>Time</th><th>Set by</th><th>MW</th><th>Status</th><th>Acknowledged by</th><th>Accepted by</th><th>Executed by</th><th>Restoration</th></tr>${H.orders.map(o=>`<tr><td>${o.id}</td><td>${tm(o.ts)}</td><td>${o.by}</td><td>${o.mw}</td><td>${o.status}</td><td>${names(o.ack)}</td><td>${names(o.accepted)}${o.refused.length?' · refused: '+names(o.refused):''}</td><td>${names(o.executed)}</td><td>${o.restoration?o.restoration.by:'—'}</td></tr>`).join('')||'<tr><td colspan="9">No orders yet</td></tr>'}</table></div></div>`;
const addSite=()=>act('sites',{name:$('#sn').value,type:$('#st').value,feeder:$('#sf').value}),rmSite=id=>{const r=prompt(i18n('Written reason to remove this protection:'));if(r)act('sites/remove',{id,reason:r})};
const siteCard=s=>`<div class="card"><h3>Protected sites (never cut)</h3><div class="sc"><table><tr><th>Site</th><th>Type</th><th>Feeder</th><th>Registered by</th><th></th></tr>${s.sites.map(x=>`<tr><td>${x.name}</td><td>${x.type}</td><td>${x.feeder}</td><td>${x.by} · ${tm(x.ts)}</td><td>${ME.role=='ADMIN'?`<button onclick="rmSite(${x.id})">Remove…</button>`:''}</td></tr>`).join('')}</table></div>${ME.role=='ADMIN'?`<p><input id="sn" placeholder="Site name"> <select id="st"><option>Hospital</option><option>Police</option><option>Civil protection</option><option>Water station</option><option>Public administration</option></select> <input id="sf" placeholder="Feeder, e.g. F-114"> <button class="p" onclick="addSite()">Protect</button></p>`:''}<small>A feeder hosting a protected site is excluded from every plan, rotation and manual cut. Removing protection needs an ADMIN and a written reason, and is logged.</small></div>`;
const learnCard=s=>`<div class="card"><h3>Learning from history</h3><div class="sc"><table><tr><th>BCC</th><th>Orders learned</th><th>Avg plan error (MW)</th><th>Last error (MW)</th><th>Delivery vs target</th><th>Correction factor</th></tr>${s.learn.bcc.map(x=>`<tr><td>${x.bcc}</td><td>${x.orders}</td><td>${x.planErr??'—'}</td><td>${x.lastErr??'—'}</td><td>${x.exec==null?'—':x.exec+' %'}</td><td>${x.factor}</td></tr>`).join('')}</table></div><small>${s.learn.learnedFeeders} feeder loads learned. After each outage the platform updates the real load of each feeder, corrects each BCC's planning with its past delivery, and updates the fairness history. These are explainable adaptive statistics, not a black-box model.</small></div>`;
const L2=(e,f)=>LG=='fr'?f:e,SCL={A:['Official keys, no flexibility','Clés officielles, sans flexibilité'],B:['Official keys + flexibility','Clés officielles + flexibilité'],C:['Fairness-weighted + flexibility','Pondérée par l\'équité + flexibilité']};
const setSit=()=>act('situation',{demand:$('#sd').value,gen:$('#sg').value,ic:$('#si').value,trip:$('#str').value}),reqFlex=async()=>{for(const x of ST.flex)if(['Available','Declined'].includes(x.state))try{await api('flex/request',{id:x.id})}catch(e){}refresh()},
 approve=id=>{const x=SC.scenarios.find(y=>y.id==id);act('orders',{mw:SC.deficit,am:x.am,useFlex:x.useFlex,cause:'Scenario '+x.id+': '+SCL[x.id][0]})};
const scCard=(x,rec)=>`<div class="box" style="border:2px solid var(--${x.id==rec?'a':'l'})">${x.id==rec?bd('g',L2('Recommended','Recommandé'))+' ':''}<b>${x.id}. ${SCL[x.id][LG=='fr'?1:0]}</b>${x.same?`<br><small>${L2('Same as A: no flexibility accepted yet','Identique à A : aucune flexibilité acceptée')}</small>`:''}
 <p>${L2('Conventional shedding','Délestage conventionnel')}: <b>${x.conventional} MW</b><br>${L2('Flexibility used','Flexibilité utilisée')}: <b>${x.flexMW} MW</b><br>${L2('North / South','Nord / Sud')}: ${x.north} / ${x.south} MW<br><small>${x.bcc.map(b=>`${b.bcc} ${b.mw}${b.ok?'':' ⚠'}`).join(' · ')}</small></p>
 <p>${L2('People affected (estimate)','Personnes touchées (estimation)')}: <b>${x.consumers.toLocaleString(LG=='fr'?'fr-FR':'en-GB')}</b><br>${L2('Fairness of impact','Équité de l\'impact')}: <b>${x.fairness}/100</b><br>${x.feasible?bd('g',L2('Feasible','Réalisable')):bd('r',L2('Exceeds a BCC capacity','Dépasse la capacité d\'un BCC'))}</p>
 <button class="p" ${x.feasible?'':'disabled'} onclick="approve('${x.id}')">${L2('Approve and create order','Approuver et créer l\'ordre')}</button></div>`;
const decCard=s=>{const z=s.sit;if(!z)return'';const bars=z.j1.map(x=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(Math.min(60,x.deficit/Math.max(1,z.j1peak)*60))}px;background:var(--${x.deficit?'o':'g'});border-radius:3px 3px 0 0"></div><small>${x.h}h</small></div>`).join(''),rec=SC&&SC.recommended,sc=SC&&SC.scenarios||[],R_=sc.find(x=>x.id==rec);
 const why=R_?`<div class="w"><b>${L2('Why','Pourquoi')} ${rec}?</b><br>${L2('Follows the official STEG keys (North 65% / South 35%, Tunis spared up to 200 MW).','Respecte les clés officielles STEG (Nord 65 % / Sud 35 %, Tunis épargné jusqu\'à 200 MW).')}<br>${z.flexAccepted>0?L2(`Uses ${z.flexAccepted} MW of accepted flexibility first, so conventional shedding drops to ${R_.conventional} MW.`,`Utilise d'abord ${z.flexAccepted} MW de flexibilité acceptée : le délestage conventionnel tombe à ${R_.conventional} MW.`):L2('No flexibility accepted yet: request it in step 2 to reduce the conventional cut.','Aucune flexibilité acceptée : demandez-la à l\'étape 2 pour réduire la coupure conventionnelle.')}<br>${R_.feasible?L2('Every BCC share fits its sheddable capacity; protected sites are excluded.','Chaque part de BCC tient dans sa capacité délestable ; les sites protégés sont exclus.'):L2('Warning: a BCC share exceeds its capacity.','Attention : une part de BCC dépasse sa capacité.')}${SC.fairer?`<br>${L2(`Scenario ${SC.fairer.id} is fairer by ${SC.fairer.delta} points but departs from the official keys.`,`Le scénario ${SC.fairer.id} est plus équitable de ${SC.fairer.delta} points mais s'écarte des clés officielles.`)}`:''}</div>`:'';
 return `<div class="card"><h3>${L2('Decision assistant','Assistant de décision')}</h3><p><b>1. ${L2('Situation','Situation')}</b> <small>(${L2('simulated data','données simulées')})</small></p>
